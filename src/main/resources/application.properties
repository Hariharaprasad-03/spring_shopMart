spring.application.name=spring-jpa


# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/contactdb
spring.datasource.username=root
spring.datasource.password=Hariprasad!03
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# In Boot 4/Hibernate 7, 'update' is fine for dev,
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# DIALECT: You can usually DELETE this line in Boot 4.
# If you keep it, this generic dialect is the correct one.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect